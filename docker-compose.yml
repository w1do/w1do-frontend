name: ai-agency

services:
  web:
    build:
      context: .
      args:
        # Unset = production CDN (https://w1do.ru). Set to empty for local testing (same-origin assets).
        ASSETS_PREFIX: ${ASSETS_PREFIX-https://w1do.ru}
    restart: unless-stopped
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      LEADS_API_KEY: ${LEADS_API_KEY:-}
      LEADS_API_BASE_URL: ${LEADS_API_BASE_URL:-}
      W1DO_DEFAULT_CITY: ${W1DO_DEFAULT_CITY:-moscow}
      POLZA_AI_API_KEY: ${POLZA_AI_API_KEY:-}
      POLZA_AI_MODEL: ${POLZA_AI_MODEL:-openai/gpt-4o-mini}
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-0}
      CHAT_LEAD_HASH_SECRET: ${CHAT_LEAD_HASH_SECRET:-}
    ports:
      - "127.0.0.1:4380:4321"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - default
      - dokploy-network

  redis:
    image: redis:7
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli PING | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

volumes:
  redis-data:

networks:
  dokploy-network:
    external: true
